<title id="title">realXhub implemented lifecycle and remaining work</title><desc id="desc">Proposal approval and activation lead to soft reservations, a three day paid claim window and first half payment. Partial paid campaigns reopen. Approved evidence releases the second half. Expiry leaves assets locked and default redemption is deferred.</desc>
