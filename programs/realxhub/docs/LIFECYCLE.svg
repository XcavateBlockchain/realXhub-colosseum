<text x="40" y="831" class="section" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">ASSETS AND CURRENT BOUNDARIES</text>
<rect x="40" y="850" width="600" height="140" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
<text x="58" y="882" class="node-title" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172b4d">Payments and token custody</text>
<text x="58" y="911" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Reservations leave stablecoins in buyer wallets</text>
<text x="58" y="934" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Paid claims exchange payment for buyer hub tokens</text>
<text x="58" y="957" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Final claim pays half; approval pays the balance</text>
<text x="58" y="980" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Payouts exclude unsolicited vault deposits</text>
<rect x="680" y="850" width="640" height="140" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
<text x="698" y="882" class="node-title" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172b4d">Collateral and default boundaries</text>
<text x="698" y="911" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Fixed XCAV quantity; no 30 percent valuation</text>
<text x="698" y="934" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Oracle pricing and top ups are deferred</text>
<text x="698" y="957" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Default redemption is implemented</text>
<text x="698" y="980" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Successful bond withdrawal is also absent</text>
<rect x="40" y="1030" width="1280" height="112" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
<text x="58" y="1062" class="node-title" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172b4d">Two verified setup issues to resolve</text>
<text x="58" y="1091" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">A legacy purchase between activation and reservation opening blocks the switch: use atomic setup.</text>
<text x="58" y="1114" class="body" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Funding can start before an assessor policy exists: require usable policy and service before buyer payments.</text>
<text x="40" y="1187" class="subtitle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">Default redemption is implemented; automated scoring and 30 percent collateral maintenance remain incomplete.</text>
<text x="40" y="1225" class="small" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Legacy paid sales remain a separate path. See IMPLEMENTATION.md for their claims, refunds and escrow rules.</text>
<text x="40" y="1254" class="small" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Diagram arrows describe current transitions. Reopening, expiry cleanup and evidence assessment require transactions.</text>
